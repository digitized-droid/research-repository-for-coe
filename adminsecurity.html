<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* GLOBAL PAGE SIDE MARGINS */
.page-wrap {
  width: min(1240px, calc(100% - 3rem));
  margin: 0 auto;
}
html, body {
  height: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
}

#main-content {
  flex: 1; /* pushes footer down */
}

footer {
  margin-top: auto;
}
	:root {
            --primary-blue: #003366;
            --secondary-blue: #00509d;
            --accent-yellow: #ffcc00;
            --soft-white: #f8f9fa;
            --text-dark: #212529;
			--gold: #fbbf24;
            --text-gray: #6c757d;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --gradient: linear-gradient(135deg, #003366 0%, #00509d 100%);
			--max: 1240px;
        }

    body {
	font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--soft-white);
      color: var(--text-dark);
      line-height: 1.6;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      
      background: #ffffff;
      height: 100%;
    }
	

    *, *::before, *::after { box-sizing: border-box; }

    html { height: 100%; scroll-behavior: smooth; }

    img { max-width: 100%; display: block; }
    a { text-decoration: none; }
    .container { width: min(var(--max), calc(100% - 2rem)); margin: auto; }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 999;
      backdrop-filter: blur(14px);
      background: #1e3a8a;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--white);
    }

    .myImage{width:450px;max-width:100%}
    .brand-text small {
      display: block;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .brand-text strong {
      font-size: 1rem;
      font-weight: 700;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 1.6rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-menu a {
      color: #fff;
      font-weight: 600;
      position: relative;
      padding: 0.2rem 0;
    }

    .nav-menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
            height: 2.5px;
  border-radius: 2px;
      background: var(--gold);
      transition: 0.25s ease;
    }

    .nav-menu a:hover::after,
    .nav-menu a.active::after { width: 100%; }

    .nav-cta {
      background: var(--gold);
      color: var(--navy) !important;
      padding: 0.7rem 1rem !important;
      border-radius: 999px;
      box-shadow: var(--shadow-soft);
    }

    .nav-cta::after { display: none; }

    /* DROPDOWN MENU */
.dropdown{
  position:relative;
}

.dropdown-menu{
  display:none;
  position:absolute;
  top:100%;
  left:0;
  background:white;
  min-width:200px;
  list-style:none;
  padding:8px 0;
  border-radius:6px;
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
  z-index:1000;
}

.dropdown-menu li{
  width:100%;
}

.dropdown-menu a{
  display:block;
  padding:10px 16px;
  color:#1e3a8a;
  text-decoration:none;
  font-size:0.95rem;
}

.dropdown-menu a:hover{
  background:#f3f4f6;
  color:#fbbf24;
}

/* show dropdown on hover (desktop) */
.dropdown:hover .dropdown-menu{
  display:block;
}

/* remove underline animation inside dropdown */
.dropdown-menu a::after{
  display:none;
}
	/* Footer */
    footer {
      background: #1e3a8a;
      color: #ffffff;
      text-align: center;
      padding: 2.5rem 2rem;
    }

    footer p {
      margin: 0;
      opacity: 0.9;
    }

    .footer-accent {
      color: #fbbf24;
      font-weight: bold;
    }
	
	

/* Mobile breakpoint */
@media (max-width: 768px) {
  .body {
    background: url('viewphone.gif') no-repeat center center fixed;
	height: 100%;
  width: 100%;
    background-size: cover;
	
  }
}
@media (max-width: 900px) {
  .header-container { 
    flex-direction: column; 
    gap: 1rem; 
  }

  .nav-menu { 
    gap: 1rem; 
  }
}
/* =========================
   TABLET RESPONSIVENESS
   ========================= */
/* Tablet breakpoint */
@media (min-width: 769px) and (max-width: 1024px) {
  .body {
    background: url('viewtablet.gif') no-repeat center center fixed;
    background-size: cover;
    height: 100%;
    width: 100%;
  }
}

.user-settings { position: relative; margin-left: 1rem; } 
.gear-icon svg { width: 50px; height: 50px; display: block; } 
.gear-icon:hover svg { transform: rotate(20deg); transition: 0.3s ease; } 
.settings-dropdown { display: none; position: absolute; right: 0; top: 120%; width: 260px; max-height: 400px; overflow-y: auto; background: #ffffff; padding: 15px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 1000; } 
.settings-header { font-weight: bold; color: #1e3a8a; text-align: center; margin-bottom: 8px; } 
.settings-content h4 { margin: 10px 0; font-size: 0.95rem; color: #1e3a8a; } 
.settings-content input { width: 100%; padding: 6px; margin: 6px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 0.85rem; } 
.settings-content button { width: 100%; padding: 6px; margin-bottom: 8px; background: #1e3a8a; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; } 
.settings-content button:hover { background: #2563eb; } #logoutBtn { display: block; margin-left: auto; /* pushes it to the right */ background: #1e3a8a; border-radius: 5px; color: white; margin-top: 10px; } 
#logoutBtn:hover { background:white; border-radius: 5px; color:#1e3a8a; } 

.dashboard {
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  background: #E6E6E6;
  color: #333;
  padding: 20px;
}

.logo {
  margin-bottom: 30px;
}

.menu {
  list-style: none;
  padding: 0;
}

.menu li {
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 10px;
}

.menu li:hover,
.menu li.active {
  background: #1e3a8a;
  color: #ffffff;
}
/* =========================
   RESPONSIVE SIDEBAR → TOPBAR
   ========================= */

/* Tablet + Mobile */
@media (max-width: 1024px) {

  .dashboard {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 15px;
  }

  .logo {
    margin-bottom: 10px;
    text-align: center;
  }

  .menu {
    display: flex;
    width: 100%;
    justify-content: center;
    gap: 10px;
  }

  .menu li {
    flex: 1;
    text-align: center;
    margin-bottom: 0;
    padding: 10px;
    font-size: 0.9rem;
  }

  .main-content {
    padding: 15px;
  }
}

/* MAIN CONTENT */
.main-content {
  flex: 1;
  padding: 30px;
  background: #f4f6f9;
  overflow-y: auto;
}

/* SECTIONS */
.section {
  display: none;
}

.section.active {
  display: block;
}

/* CARDS */
.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

/* INPUTS */
input, textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: 1px solid #ddd;
}

/* BUTTON */
button {
  background: #1e3a8a;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 6px;
}

button:hover {
  background: #2563eb;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}
</style>
</head>

    <header>

<script>

const { createClient } = window.supabase;

const supabaseClient = createClient(
  "https://vwzhzycagqqhcxbopjtc.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3emh6eWNhZ3FxaGN4Ym9wanRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NjI4NjEsImV4cCI6MjA5MDEzODg2MX0.KajiaXQecd-Icu6D9XUKViBsRn4bldVfwoFeamog8ww"
);

/* =========================
   GLOBAL STATE
========================= */
let allUsers = [];
let allStudents = [];
let currentStudentView = [];

let currentPage = 1;
const rowsPerPage = 10;

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", async () => {
  await init();
  initSettings();
});

async function init() {
  await checkAdmin();

  /* load BOTH immediately */
  await Promise.all([
    loadUsers(),
    loadStudents()
  ]);

  /* default visible page */
  showSection("users");
}

/* =========================
   ADMIN CHECK
========================= */
async function checkAdmin() {
  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    location.replace("index.html");
    return;
  }

  const user = session.user;

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  if (error || !profile || profile.role !== "admin") {
    await supabaseClient.auth.signOut();
    location.replace("index.html");
  }
}

/* =========================
   SECTION SWITCHER
========================= */
function showSection(section) {
  document.querySelectorAll(".section").forEach(sec => {
    sec.classList.remove("active");
  });

  document.querySelectorAll(".menu li").forEach(li => {
    li.classList.remove("active");
  });

  if (section === "users") {
    document.getElementById("usersSectionUI").classList.add("active");
    document.querySelectorAll(".menu li")[0].classList.add("active");
  } else {
    document.getElementById("studentsSectionUI").classList.add("active");
    document.querySelectorAll(".menu li")[1].classList.add("active");
  }
}

/* =========================
   USERS
========================= */
async function loadUsers() {
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .order("full_name", { ascending: true });

  if (error) {
    console.error(error);
    alert("Failed loading users");
    return;
  }

  allUsers = data || [];
  renderUsers(allUsers);
}

function renderUsers(data) {
  const tbody = document.querySelector("#usersTable tbody");
  tbody.innerHTML = "";

  let html = "";

  data.forEach(user => {
    html += `
      <tr>
        <td>${user.student_number || ""}</td>
        <td>${user.full_name || ""}</td>
        <td>${user.email || ""}</td>
        <td>${user.phone || ""}</td>

        <td>
          <select onchange="updateUserRole('${user.id}', this.value)">
            <option value="user" ${user.role === "user" ? "selected" : ""}>user</option>
            <option value="admin" ${user.role === "admin" ? "selected" : ""}>admin</option>
          </select>
        </td>

        <td>
          <button onclick="deleteUser('${user.id}')">Delete</button>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
  
}

function filterUsers() {
  const keyword =
    document.getElementById("userSearch").value.toLowerCase();

  const filtered = allUsers.filter(user =>
    (user.student_number || "").toLowerCase().includes(keyword) ||
    (user.full_name || "").toLowerCase().includes(keyword) ||
    (user.email || "").toLowerCase().includes(keyword)
  );

  renderUsers(filtered);
}

async function updateUserRole(id, role) {
  const { error } = await supabaseClient
    .from("profiles")
    .update({ role })
    .eq("id", id);

  if (error) alert(error.message);
}

async function deleteUser(id) {
  if (!confirm("Delete user?")) return;

  const { error } = await supabaseClient
    .from("profiles")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadUsers();
}

/* =========================
   STUDENTS
========================= */
async function loadStudents() {
  const { data, error } = await supabaseClient
    .from("students_masterlist")
    .select("*")
    .order("student_number", { ascending: false });

  if (error) {
    console.error(error);
    alert("Failed loading students");
    return;
  }

  allStudents = data || [];
  currentStudentView = [...allStudents];
  currentPage = 1;

  renderStudents();
}

function renderStudents() {
  const tbody = document.querySelector("#studentsTable tbody");
  tbody.innerHTML = "";

  const start = (currentPage - 1) * rowsPerPage;
  const end = start + rowsPerPage;

  const rows = currentStudentView.slice(start, end);

  let html = "";

  rows.forEach(student => {
    html += `
      <tr>
        <td contenteditable="true"
            onblur="updateStudent('${student.id}','student_number',this.innerText)">
          ${student.student_number}
        </td>

        <td contenteditable="true"
            onblur="updateStudent('${student.id}','full_name',this.innerText)">
          ${student.full_name}
        </td>

        <td>${student.is_registered}</td>

        <td>
          <button onclick="deleteStudent('${student.id}')">Delete</button>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;

   // Page info
  const total = allStudents.length;
  const pageInfo = document.getElementById("pageInfo");

  pageInfo.innerText =
    `Page ${currentPage} (${start + 1}-${Math.min(end, total)} of ${total})`;
}

function filterStudents() {
  const keyword =
    document.getElementById("studentSearch").value.toLowerCase();

  currentStudentView = allStudents.filter(student =>
    student.student_number.toLowerCase().includes(keyword) ||
    student.full_name.toLowerCase().includes(keyword)
  );

  currentPage = 1;
  renderStudents();
}

function nextPage() {
  if (currentPage * rowsPerPage < currentStudentView.length) {
    currentPage++;
    renderStudents();
  }
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderStudents();
  }
}

async function updateStudent(id, field, value) {
  const { error } = await supabaseClient
    .from("students_masterlist")
    .update({ [field]: value.trim() })
    .eq("id", id);

  if (error) alert(error.message);
}

async function deleteStudent(id) {
  if (!confirm("Delete student?")) return;

  const { error } = await supabaseClient
    .from("students_masterlist")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadStudents();
}

async function addStudent() {
  const student_number =
    document.getElementById("new_student_number").value.trim();

  const full_name =
    document.getElementById("new_full_name").value.trim();

  if (!student_number || !full_name) {
    alert("Fill all fields");
    return;
  }

  const { error } = await supabaseClient
    .from("students_masterlist")
    .insert([{
      student_number,
      full_name,
      is_registered: false
    }]);

  if (error) {
    alert(error.message);
    return;
  }

  document.getElementById("new_student_number").value = "";
  document.getElementById("new_full_name").value = "";

  await loadStudents();
}
</script>
